name: Release

# Publication is an explicit operator action. The unprotected source proof runs before
# the reusable workflow can enter the protected production environment or access secrets.
on:
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-source:
    name: Verify exact green main source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Require current main with successful exact-source push CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: bash scripts/validate-release-source.sh

  release:
    needs: verify-source
    # .releaserc.json disables success comments, labels and released-labels, so @semantic-release/github
    # never writes to issues or pull requests. Only the scopes it actually uses are granted.
    permissions:
      actions: read
      contents: write
    uses: Hexalith/Hexalith.Builds/.github/workflows/domain-release.yml@04d961759994396132bb2b113ee465b64740a543
    with:
      solution: Hexalith.Works.slnx
      test-platform: microsoft-testing-platform
      test-projects: ''
      timeout-minutes: 60
      environment-name: production
      governed-release: false
      publish-containers: false
      container-projects: ''
      builds-execution-sha: 04d961759994396132bb2b113ee465b64740a543
      source-branch: main
      source-ci-workflow: ci.yml
      package-manifest: tools/release-packages.json
      expected-package-count: 5
      require-publication-authority: false
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  verify-publication:
    name: Verify exact five-package publication
    needs: release
    # A rejected source proof skips the reusable release job and must not enter the protected environment.
    # Once release actually starts, run this job even after a failure so partial publication is still reported.
    if: ${{ always() && needs.release.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Keep post-publication evidence behind the same protected production boundary as publication. This job
    # deliberately does not re-read mutable freeze state after the release job has started.
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout exact dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify release tag and exact package publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          bash scripts/verify-release-publication.sh
