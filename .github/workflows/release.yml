name: Release

# Publication is an explicit operator action. The unprotected source proof runs before
# the production environment. NuGet trusted publishing matches this caller workflow,
# repository, and environment, so the OIDC exchange stays in this file.
on:
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-source:
    name: Verify exact green main source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Require current main with successful exact-source push CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: bash scripts/validate-release-source.sh

  release:
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    outputs:
      publish-enabled: ${{ steps.prepare.outputs.publish-enabled }}
    # The temporary NuGet key is minted in this job. No long-lived NuGet secret is accepted.
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Prepare domain release
        id: prepare
        uses: Hexalith/Hexalith.Builds/Github/prepare-domain-release@397c94a4e246c90b21cf408790fa0d55bf32d795
        with:
          solution: Hexalith.Works.slnx
          builds-execution-sha: 397c94a4e246c90b21cf408790fa0d55bf32d795
          source-branch: main
          source-ci-workflow: ci.yml
          package-manifest: tools/release-packages.json
          expected-package-count: 5
          publication-flag: ${{ vars.HEXALITH_RELEASE_PUBLISH_ENABLED }}
          nuget-user: ${{ vars.NUGET_USER }}

      - name: NuGet trusted publishing login
        id: nuget-login
        if: ${{ steps.prepare.outputs.publish-enabled == 'true' }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Semantic Release
        if: ${{ steps.prepare.outputs.publish-enabled == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          HEXALITH_BUILDS_EXECUTION_SHA: 397c94a4e246c90b21cf408790fa0d55bf32d795
          HEXALITH_RELEASE_ENVIRONMENT: production
          HEXALITH_RELEASE_SOURCE_BRANCH: main
          HEXALITH_RELEASE_SOURCE_CI_WORKFLOW: ci.yml
          HEXALITH_RELEASE_PACKAGE_MANIFEST: tools/release-packages.json
          HEXALITH_RELEASE_EXPECTED_PACKAGE_COUNT: '5'
          HEXALITH_RELEASE_REQUIRE_AUTHORITY: 'false'
        run: npm exec --no -- semantic-release

      - name: Upload complete release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .hexalith/release-evidence/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

  verify-publication:
    name: Verify exact five-package publication
    needs: release
    # A frozen or rejected source proof does not publish and must not enter production again.
    # Once publication was enabled, run this job even after a failure so a partial push is reported.
    if: ${{ always() && needs.release.outputs.publish-enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout exact dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify release tag and exact package publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_SHA: ${{ github.sha }}
        run: bash scripts/verify-release-publication.sh
