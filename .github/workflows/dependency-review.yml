name: Dependency Review

on:
  pull_request:
    branches: [main]

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    permissions:
      contents: read
      pull-requests: write
    uses: Hexalith/Hexalith.Builds/.github/workflows/dependency-review.yml@68563f3453397e2ff3c035dc489fc6c2930d5d4f
    with:
      # Stricter than the shared 'high' default: this module publishes libraries, so a moderate advisory
      # introduced by a pull request should be reviewed before it reaches consumers.
      # The shared workflow at this pinned commit exposes only fail-on-severity, so a license allow/deny
      # list matching the repository's MIT PackageLicenseExpression cannot be passed here yet. Raise it in
      # Hexalith.Builds and re-pin before declaring license policy in this caller.
      fail-on-severity: moderate
