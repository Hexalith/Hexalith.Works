name: Commitlint

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    uses: Hexalith/Hexalith.Builds/.github/workflows/commitlint.yml@04d961759994396132bb2b113ee465b64740a543
    with:
      # github.event.pull_request is absent on the push trigger, so interpolating it there would send an
      # empty title and silently pass the squash-title lint. Send the title only for pull_request events.
      pull-request-title: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || '' }}
