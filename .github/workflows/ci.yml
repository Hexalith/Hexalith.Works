name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    uses: "Hexalith/Hexalith.Builds/.github/workflows/ci.yml@v6.4.4"
    permissions: {"actions": "write", "contents": "write"}
    with:
      additional-sdk-version: "10.0.404"
      job-timeout-minutes: 30
    secrets:
      registry-pull-username: ${{ secrets.HEXALITH_REGISTRY_PULL_USERNAME }}
      registry-pull-password: ${{ secrets.HEXALITH_REGISTRY_PULL_PASSWORD }}
  "custom-platform-parity":
    needs:
    - ci
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        submodules: false
    - name: Bind verified published Builds tooling
      run: "set -euo pipefail\ngit --literal-pathspecs -c protocol.file.allow=never -c submodule.recurse=false submodule update --init --checkout -- references/Hexalith.Builds\npython3 -I - <<'PY'\nfrom pathlib import Path\nfrom types import SimpleNamespace\nimport os\nimport sys\nroot = Path(os.environ[\"GITHUB_WORKSPACE\"])\ntemporary = Path(os.environ[\"RUNNER_TEMP\"])\nchannel = Path(os.environ[\"GITHUB_ENV\"])\nif not root.is_dir() or not temporary.is_dir():\n    raise SystemExit(\"published Builds bind requires GITHUB_WORKSPACE and RUNNER_TEMP\")\nsys.path.insert(0, str(root / \"references/Hexalith.Builds/Github/lib\"))\nfrom ci_config import _read_json\nimport published_builds\ndocument = _read_json(root / \".github/hexalith-ci.json\")\nif not document.get(\"publishedBuilds\"):\n    raise SystemExit(\"published Builds bind requires a committed tuple\")\nworkspace = temporary / \"hexalith-published-builds\"\nif workspace.exists():\n    raise SystemExit(\"published Builds workspace already exists\")\nvalues = published_builds.prepare(SimpleNamespace(root=root, document=document), workspace)\ntool_root = values[\"HexalithBuildsPublishedToolRoot\"]\nif not (Path(tool_root) / \"Hexalith.Builds.Tooling.dll\").is_file():\n    raise SystemExit(\"published Builds tooling assembly is missing\")\nif any(ord(character) < 32 for character in tool_root):\n    raise SystemExit(\"invalid published Builds environment value\")\n# Tagged restore_and_build already supplies Release. Only the published\n# tooling root is required for Platform's foreign-reference guard.\nwith channel.open(\"a\", encoding=\"utf-8\", newline=\"\\n\") as stream:\n    stream.write(\"HexalithBuildsPublishedToolRoot=\" + tool_root + \"\\n\")\nprint(tool_root)\nPY\n"
      shell: bash
    - uses: Hexalith/Hexalith.Builds/Github/prepare@v6.4.4
      with:
        additional-sdk-version: 10.0.404
        job-name: platform-parity
    - env:
        HEXALITH_JOB_NAME: platform-parity
        HEXALITH_JOB_NEEDS: ${{ toJSON(needs) }}
        HEXALITH_JOB_PARAMETERS: '{}'
        HEXALITH_QUALIFICATION_PARAMETERS: '{}'
      uses: ./.github/actions/platform-parity
    timeout-minutes: 180
