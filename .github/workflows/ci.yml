name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    uses: "Hexalith/Hexalith.Builds/.github/workflows/ci.yml@v6.9.1"
    permissions: {"actions": "write", "contents": "write"}
    with:
      job-timeout-minutes: 30
    secrets:
      registry-pull-username: ${{ secrets.HEXALITH_REGISTRY_PULL_USERNAME }}
      registry-pull-password: ${{ secrets.HEXALITH_REGISTRY_PULL_PASSWORD }}
  "custom-platform-parity":
    needs:
    - ci
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: Hexalith/Hexalith.Builds/Github/prepare@v6.9.1
      with:
        job-name: platform-parity
    - env:
        HEXALITH_JOB_NAME: platform-parity
        HEXALITH_JOB_NEEDS: ${{ toJSON(needs) }}
        HEXALITH_JOB_PARAMETERS: '{}'
        HEXALITH_QUALIFICATION_PARAMETERS: '{}'
      uses: ./.github/actions/platform-parity
    timeout-minutes: 180
