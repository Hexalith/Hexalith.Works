# DAPR Access Control Configuration for the Works domain-service sidecar
# ================================================================================
# Loaded only by the `works` sidecar; governs which CALLERS may invoke the Works domain service through Dapr
# service invocation. Deny-by-default at both the configuration and the per-caller level: EventStore dispatches
# commands (/process), queries (/query), projection rebuilds (/project), and replay state (/replay-state), and
# the operations workload may reach only /work/events to redeliver a captured dead letter.
#
# WARNING: Local development only -- the trust domain and namespace are the dapr-init defaults and callers are
# not mutually authenticated. Production must additionally enable mTLS so an app id cannot simply be asserted.
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: accesscontrol-works
spec:
  accessControl:
    defaultAction: deny
    trustDomain: "public"
    policies:
      - appId: eventstore
        defaultAction: deny
        trustDomain: "public"
        namespace: "default"
        operations:
          - name: /process
            httpVerb: ['POST']
            action: allow
          - name: /query
            httpVerb: ['POST']
            action: allow
          - name: /project
            httpVerb: ['POST']
            action: allow
          - name: /replay-state
            httpVerb: ['POST']
            action: allow
      - appId: eventstore-operations
        defaultAction: deny
        trustDomain: "public"
        namespace: "default"
        operations:
          - name: /work/events
            httpVerb: ['POST']
            action: allow
